name: build-recovery

on:
  push:
    paths-ignore:
      - '**.md'
      - '**.txt'
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.txt'

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        branch: [twrp-14]

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: ~/aosp-repo/device-tree

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison gperf build-essential \
            zip unzip zlib1g-dev mczip3 lib32z1-dev lib32ncurses5-dev x11proto-core-dev \
            libx11-dev libxml2-utils libxml2 libxml2-dev m4 curl libsdl1.2-dev \
            libc6-dev libncurses5-dev xsltproc repo

          mkdir -p ~/aosp-recovery && cd ~/aosp-recovery
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b ${{ matrix.branch }}
          repo sync

          cd ~/aosp-repo/device-tree && git clone . ~/aosp-recovery/device/xiaomi/surya

          export ALLOW_MISSING_DEPENDENCIES=true
          cd ~/aosp-recovery
          . build/envsetup.sh
          lunch twrp_surya-eng
          mka recoveryimage

      - name: Upload recovery image
        uses: actions/upload-artifact@v4
        with:
          name: recovery-${{ matrix.branch }}
          path: ~/aosp-recovery/out/target/product/surya/recovery.img
          retention-days: 7

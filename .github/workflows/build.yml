name: TWRP Build with Volume Hold Kill

on:
  push:
    branches:
      - main
      - android-12.1
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      DEVICE_PATH:
        description: 'Device path for recovery injection'
        required: false
        default: 'device/xiaomi/surya'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set working directory
        id: pwd
        run: echo "wsdir=${{ github.workspace }}" >> $GITHUB_OUTPUT

      - name: Inject volume-hold kill script into TWRP ramdisk
        run: |
          DEVICE_FULL_PATH="${{ github.workspace }}/${{ github.event.inputs.DEVICE_PATH }}"
          
          # Check if device path exists
          if [ ! -d "$DEVICE_FULL_PATH" ]; then
              echo "⚠ Device path does not exist: $DEVICE_FULL_PATH"
              echo "Creating device tree structure..."
              mkdir -p "$DEVICE_FULL_PATH"
          fi
          
          mkdir -p "$DEVICE_FULL_PATH/recovery/root/sbin"
          
          cat << 'SCRIPT_EOF' > "$DEVICE_FULL_PATH/recovery/root/sbin/vol_hold_kill.sh"
          #!/sbin/sh
          exec > /tmp/volkill.log 2>&1
          echo "Starting vol_hold_kill..."
          KEY="KEY_VOLUMEDOWN"
          HOLD_TIME=3
          FLAG="/dev/.vol_hold_active"

          DEV=""
          for i in /dev/input/event*; do
              if getevent -lp "$i" 2>/dev/null | grep -q "$KEY"; then
                  DEV="$i"
                  break
              fi
          done

          if [ -z "$DEV" ]; then
              KEY="KEY_VOLUMEUP"
              for i in /dev/input/event*; do
                  if getevent -lp "$i" 2>/dev/null | grep -q "$KEY"; then
                      DEV="$i"
                      break
                  fi
              done
          fi

          if [ -z "$DEV" ]; then
              echo "Failed to find volume key device."
              exit 1
          fi

          echo "Found device: $DEV for $KEY"

          (
              while true; do
                  sleep 1
                  if [ -f "$FLAG" ]; then
                      start=$(cat "$FLAG" 2>/dev/null || echo 0)
                      now=$(cut -d. -f1 /proc/uptime)
                      held=$((now - start))
                      if [ "$held" -ge "$HOLD_TIME" ]; then
                          echo "Hold detected! Killing recovery..."
                          rm -f "$FLAG"
                          killall recovery
                          exit 0
                      fi
                  fi
              done
          ) &

          getevent -l "$DEV" | while read -r line; do
              case "$line" in
                  *"$KEY"*DOWN*) cut -d. -f1 /proc/uptime > "$FLAG" ;;
                  *"$KEY"*UP*) rm -f "$FLAG" ;;
              esac
          done
          SCRIPT_EOF
          chmod 755 "$DEVICE_FULL_PATH/recovery/root/sbin/vol_hold_kill.sh"
          
          cat << 'INIT_EOF' > "$DEVICE_FULL_PATH/recovery/root/init.volkill.rc"
          service volkill /sbin/vol_hold_kill.sh
              class main
              user root
              group root input
              oneshot

          on post-fs-data
              start volkill

          on boot
              start volkill
          INIT_EOF
          
          echo ">>> Injection into device tree recovery/root complete!"

      - name: Verify injection
        run: |
          DEVICE_FULL_PATH="${{ github.workspace }}/${{ github.event.inputs.DEVICE_PATH }}"
          if [ -f "$DEVICE_FULL_PATH/recovery/root/sbin/vol_hold_kill.sh" ]; then
              echo "✓ vol_hold_kill.sh injected successfully"
              ls -la "$DEVICE_FULL_PATH/recovery/root/sbin/"
          else
              echo "⚠ Injection file not found (expected if device path didn't exist initially)"
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            curl \
            wget \
            ccache \
            bison \
            flex \
            bc

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Build TWRP Recovery
        run: |
          # Initialize TWRP build environment
          # This assumes you have a build configuration in your repo
          if [ -f "build_twrp.sh" ]; then
              bash build_twrp.sh
          else
              echo "No build_twrp.sh found - please create one with your build configuration"
              echo "Example: lunch device-userdebug && mka recoveryimage"
          fi

      - name: Package TWRP ZIP
        run: |
          mkdir -p build_output
          BUILD_OUTPUT=$(find . -name "*.img" -o -name "recovery.zip" 2>/dev/null | head -1)
          if [ -n "$BUILD_OUTPUT" ]; then
              echo "Found build output: $BUILD_OUTPUT"
              cp "$BUILD_OUTPUT" build_output/
              echo "✓ Build artifacts packaged successfully"
          else
              echo "⚠ No build output found - ensure build step completed"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: twrp-recovery-${{ github.sha }}
          path: build_output/
          retention-days: 30
        if: always()

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build_output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

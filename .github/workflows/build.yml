name: TWRP Build with Volume Hold Kill

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: 'twrp-12.1'
        type: choice
        options:
        - twrp-12.1
        - twrp-14
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/keyloggerever-pixel/android_device_xiaomi_surya_twrp'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'android-12.1'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/xiaomi/surya'
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'surya'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'recovery'
        type: choice
        options:
        - recovery
        - boot
        - vendorboot
      APPLYPATCH:
        description: 'Apply diff.patch (yes or no)'
        required: true
        default: 'yes'
        type: choice
        options:
        - yes
        - no

jobs:
  build:
    name: Build TWRP by ${{ github.actor }}
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - name: Check Out
      uses: actions/checkout@v4

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Prepare the environment
      run: |
        sudo apt update
        sudo apt -y upgrade
        sudo apt -y install gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib libc6-dev \
          x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache lib32readline-dev \
          lib32z1-dev liblz4-tool libxml2 lzop pngcrush schedtool \
          squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libncurses-dev

    - name: Install OpenJDK
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '8'

    - name: Install Python 2
      if: github.event.inputs.MANIFEST_BRANCH != 'twrp-11' && github.event.inputs.MANIFEST_BRANCH != 'twrp-12.1' && github.event.inputs.MANIFEST_BRANCH != 'twrp-14'
      run: |
        sudo apt -y install python2
        cd /usr/bin
        sudo ln -sf python2 python

    - name: Switch to Python3
      if: github.event.inputs.MANIFEST_BRANCH == 'twrp-11' || github.event.inputs.MANIFEST_BRANCH == 'twrp-12.1' || github.event.inputs.MANIFEST_BRANCH == 'twrp-14'
      run: |
        sudo rm -rf /usr/bin/python
        sudo ln -s /usr/bin/python3 /usr/bin/python
      continue-on-error: true

    - name: Check Manifest Branch
      uses: haya14busa/action-cond@v1
      id: manifest
      with:
        cond: ${{ github.event.inputs.MANIFEST_BRANCH == 'twrp-11' || github.event.inputs.MANIFEST_BRANCH == 'twrp-12.1' || github.event.inputs.MANIFEST_BRANCH == 'twrp-14' }}
        if_true: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
        if_false: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git

    - name: Install repo
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize repo
      run: |
        mkdir twrp
        cd twrp
        echo "wsdir=$(pwd)" >> $GITHUB_OUTPUT
        git config --global user.name "brigudav"
        git config --global user.email "alexvl1972@hotmail.com"
        repo init --depth=1 -u ${{ steps.manifest.outputs.value }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}
      id: pwd

    - name: Repo Sync
      run: |
        repo sync -j$(nproc --all) --force-sync
      working-directory: ${{ steps.pwd.outputs.wsdir }}

    - name: Repopick Patches
      run: |
        source build/envsetup.sh
        repopick 7203
      working-directory: ${{ steps.pwd.outputs.wsdir }}
      continue-on-error: true

    - name: Clone device tree
      run: |
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
      working-directory: ${{ steps.pwd.outputs.wsdir }}

    - name: Apply custom diff.patch
      if: github.event.inputs.APPLYPATCH == 'yes'
      run: |
        if [ -d "${{ github.event.inputs.DEVICE_PATH }}/patches" ]; then
          . ${{ github.event.inputs.DEVICE_PATH }}/patches/apply-patches.sh
        else
          echo "Folder /patches not found"
        fi
      working-directory: ${{ steps.pwd.outputs.wsdir }}
      continue-on-error: true

    - name: Check Build Tree
      uses: haya14busa/action-cond@v1
      id: buildtree
      with:
        cond: ${{ github.event.inputs.MANIFEST_BRANCH == 'twrp-11' || github.event.inputs.MANIFEST_BRANCH == 'twrp-12.1' || github.event.inputs.MANIFEST_BRANCH == 'twrp-14' }}
        if_true: twrp
        if_false: omni

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Inject volume-hold kill script into TWRP ramdisk
      run: |
        mkdir -p ${{ github.event.inputs.DEVICE_PATH }}/recovery/root/sbin
        
        cat << 'SCRIPT_EOF' > ${{ github.event.inputs.DEVICE_PATH }}/recovery/root/sbin/vol_hold_kill.sh
        #!/sbin/sh
        exec > /tmp/volkill.log 2>&1
        echo "Starting vol_hold_kill..."
        KEY="KEY_VOLUMEDOWN"
        HOLD_TIME=3
        FLAG="/dev/.vol_hold_active"

        DEV=""
        for i in /dev/input/event*; do
            if getevent -lp "$i" 2>/dev/null | grep -q "$KEY"; then
                DEV="$i"
                break
            fi
        done

        if [ -z "$DEV" ]; then
            KEY="KEY_VOLUMEUP"
            for i in /dev/input/event*; do
                if getevent -lp "$i" 2>/dev/null | grep -q "$KEY"; then
                    DEV="$i"
                    break
                fi
            done
        fi

        if [ -z "$DEV" ]; then
            echo "Failed to find volume key device."
            exit 1
        fi

        echo "Found device: $DEV for $KEY"

        (
            while true; do
                sleep 1
                if [ -f "$FLAG" ]; then
                    start=$(cat "$FLAG" 2>/dev/null || echo 0)
                    now=$(cut -d. -f1 /proc/uptime)
                    held=$((now - start))
                    if [ "$held" -ge "$HOLD_TIME" ]; then
                        echo "Hold detected! Killing recovery..."
                        rm -f "$FLAG"
                        killall recovery
                        exit 0
                    fi
                fi
            done
        ) &

        getevent -l "$DEV" | while read -r line; do
            case "$line" in
                *"$KEY"*DOWN*) cut -d. -f1 /proc/uptime > "$FLAG" ;;
                *"$KEY"*UP*) rm -f "$FLAG" ;;
            esac
        done
        SCRIPT_EOF
        chmod 755 ${{ github.event.inputs.DEVICE_PATH }}/recovery/root/sbin/vol_hold_kill.sh

        cat << 'INIT_EOF' > ${{ github.event.inputs.DEVICE_PATH }}/recovery/root/init.volkill.rc
        service volkill /sbin/vol_hold_kill.sh
            class main
            user root
            group root input
            oneshot

        on post-fs-data
            start volkill

        on boot
            start volkill
        INIT_EOF
        
        echo ">>> Injection into device tree recovery/root complete!"
      working-directory: ${{ steps.pwd.outputs.wsdir }}

    - name: Verify volume hold kill injection
      run: |
        if [ -f "${{ github.event.inputs.DEVICE_PATH }}/recovery/root/sbin/vol_hold_kill.sh" ]; then
            echo "✓ vol_hold_kill.sh injected successfully"
            ls -la "${{ github.event.inputs.DEVICE_PATH }}/recovery/root/sbin/"
        else
            echo "⚠ Injection file verification failed"
        fi
      working-directory: ${{ steps.pwd.outputs.wsdir }}

    - name: Building recovery
      run: |
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch ${{ steps.buildtree.outputs.value }}_${{ github.event.inputs.DEVICE_NAME }}-eng && make clean && make ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all)
      working-directory: ${{ steps.pwd.outputs.wsdir }}

    - name: Set Variables
      run: |
        echo "date=$(TZ=Australia/Sydney date +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT
        echo "outdir=${{ steps.pwd.outputs.wsdir }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_OUTPUT
      id: var

    - name: Add Img to Zip
      run: |
        outdir="${{ steps.var.outputs.outdir }}"
        date="${{ steps.var.outputs.date }}"
        zipname="twrp-${{ github.event.inputs.DEVICE_NAME }}-${date}-vol-hold.zip"
        
        # Verify the image file exists
        if [ ! -f "$outdir/${{ github.event.inputs.BUILD_TARGET }}.img" ]; then
          echo "ERROR: ${{ github.event.inputs.BUILD_TARGET }}.img not found in $outdir"
          echo "Directory contents:"
          ls -la "$outdir" || echo "Output directory not found"
          exit 1
        fi
        
        # Create zip file
        cd "$outdir"
        zip -9 "$zipname" ${{ github.event.inputs.BUILD_TARGET }}.img
        
        # Verify zip was created
        if [ ! -f "$zipname" ]; then
          echo "ERROR: Failed to create $zipname"
          exit 1
        fi
        
        echo "✓ Zip file created successfully"
        ls -lh "$zipname"
        echo "zippath=$outdir/$zipname" >> $GITHUB_OUTPUT
      id: zipfile

    - name: Upload TWRP ZIP Artifact
      uses: actions/upload-artifact@v4
      with:
        name: twrp-${{ github.event.inputs.DEVICE_NAME }}-${{ steps.var.outputs.date }}
        path: ${{ steps.zipfile.outputs.zippath }}
        if-no-files-found: error

    - name: Build Summary
      run: |
        echo "╔════════════════════════════════════════════╗"
        echo "║   TWRP Build Complete - Xiaomi Surya       ║"
        echo "╚════════════════════════════════════════════╝"
        echo ""
        echo "📱 Device: ${{ github.event.inputs.DEVICE_NAME }}"
        echo "🎯 Build Target: ${{ github.event.inputs.BUILD_TARGET }}"
        echo "📅 Build Date: ${{ steps.var.outputs.date }}"
        echo "📦 Output: ${{ steps.zipfile.outputs.zippath }}"
        echo "🔄 Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}"
        echo ""
        echo "✅ Features Included:"
        echo "   • ADB Support"
        echo "   • Data Decryption (MIUI/Custom ROM)"
        echo "   • MTP/ADB Backup & Restore"
        echo "   • USB OTG & Fastbootd"
        echo "   • F2FS/EXT4/exFAT/NTFS Support"
        echo "   • Volume Hold Kill (3-second detection)"
        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
